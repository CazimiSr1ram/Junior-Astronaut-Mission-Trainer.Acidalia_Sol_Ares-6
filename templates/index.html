
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mars Mission Trainer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
  <div class="game-container">
    <canvas id="renderCanvas"></canvas>

    <div class="mission-panel">
      <h5>Mars Mission Trainer</h5>
      <p id="solDisplay">Sol 1 / 90</p>
      <div class="resource-list" aria-live="polite">
        <p>Oxygen: <span id="oxygenDisplay">100%</span></p>
        <p>Water: <span id="waterDisplay">100%</span></p>
        <p>Food: <span id="foodDisplay">100%</span></p>
        <p>Power: <span id="powerDisplay">100%</span></p>
        <p class="resource-secondary">Battery reserve: <span id="batteryReserveDisplay">40%</span></p>
        <p class="resource-secondary">Oxygen reserve: <span id="oxygenReserveDisplay">30%</span></p>
        <p class="resource-secondary">Water reserve: <span id="waterReserveDisplay">30%</span></p>
        <p class="resource-secondary">Crew health: <span id="crewHealthDisplay">100%</span></p>
        <p class="resource-secondary">Crew comfort: <span id="crewComfortDisplay">100%</span></p>
      </div>

      <div class="emergency-test-controls" aria-label="Deterministic emergency test controls">
        <p class="small text-uppercase mb-2">Emergency tests</p>
        <button class="btn btn-sm btn-outline-warning" data-trigger-emergency="dustStorm">Dust storm</button>
        <button class="btn btn-sm btn-outline-warning" data-trigger-emergency="oxygenFailure">Oxygen failure</button>
        <button class="btn btn-sm btn-outline-warning" data-trigger-emergency="waterMalfunction">Water malfunction</button>
      </div>
    </div>
  </div>

  <div class="modal fade" id="emergencyModal" tabindex="-1" aria-labelledby="emergencyTitle" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-warning">
        <div class="modal-header border-secondary">
          <h2 class="modal-title fs-5" id="emergencyTitle">Mission emergency</h2>
        </div>
        <div class="modal-body">
          <p id="emergencyPrompt">Choose a response. Each decision is final.</p>
          <div id="emergencyChoices" class="d-grid gap-2"></div>
          <div id="emergencyResult" class="alert alert-info mt-3 mb-0 d-none" role="status"></div>
        </div>
        <div class="modal-footer border-secondary">
          <button id="emergencyClose" type="button" class="btn btn-secondary d-none" data-bs-dismiss="modal">Continue mission</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/mission-state.js') }}"></script>
  <script src="{{ url_for('static', filename='js/game.js') }}"></script>

</body>
</html>
